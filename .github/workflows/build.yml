run-name: "Build"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


jobs:
  check-format:
    name: Code formatting check
    runs-on: ubuntu-26.04
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check code formatting (clang-format)
        run: >
          clang-format
          --dry-run
          --Werror
          $(git ls-files -- *.cpp *.hpp *.h ':!vendor/*')

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux (GCC)"
            os: ubuntu-26.04
            cc: gcc
            cxx: g++
            cxx_flags: -Werror
          - name: "Linux (Clang)"
            os: ubuntu-26.04
            cc: clang
            cxx: clang++
            cxx_flags: -Werror
          - name: "Windows (MSVC)"
            cc: cl
            cxx: cl
            os: windows-latest
            cxx_flags: /WX

    name: Build & Test ${{ matrix.name }}
    needs: check-format
    runs-on: ${{ matrix.os }}  

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps: 
      - name: "Checkout repository"
        uses: actions/checkout@v7.0.1

      - name: Configure Linux environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules \
            libgl1-mesa-dev pkg-config xvfb

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-msvc-env

      - name: Configure CMake
        run: > 
          cmake 
          -B build 
          -G Ninja
          -DENABLE_DEBUG_UTILS=OFF
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"
          -DCMAKE_BUILD_TYPE=Release


      - name: Build
        run: >
          cmake 
          --build build
          --config Release
          --parallel

      - name: Test 
        run: >
          ctest
          --test-dir build
          --output-on-failure
          --build-config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.os }}-${{ matrix.cc }}
          path: build/
        


